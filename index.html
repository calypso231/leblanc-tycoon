 {t:"손질과 등급",u:1,h:()=>`재료마다 맞는 손질법(자르기·갈기·추출)이 있어요. 다른 방법으로 손질하면 맛이 아쉬워 값을 깎아 줘야 해요.<br><b>얼음</b>과 <b>우유</b>는 손질 없이 그대로 넣어요(별 계산에서도 빠져요). 얼음을 넣으면 아이스 음료가 되고, 라테에는 우유가 꼭 들어가요.<br><br>손질 미니게임을 잘할수록 별이 1~3개 붙고, 별의 평균으로 등급이 정해져요. 가격: <b>보통 90% · 좋음 100% · 일품 120%</b>. 일품이면 쓴 재료 하나도 돌려받아요.`},
 {t:"매출·팁·인내심",u:1,h:()=>`손님마다 주문서 아래에 <b>인내심 게이지</b>가 있어요. 주문대에 놓인 순간부터 줄어들어요.<br>카운터에서 한 손님의 주문을 만드는 동안에는 <b>그 손님만</b> 줄고, 나머지 손님은 멈춰 있어요. 게임 화면을 떠나 있을 때는 모두 멈춰요.<br>· 초록일 때 대만족: 팁 20%<br>· 노랑일 때 대만족: 팁 10%<br>· 빨강: 팁 없음, 다 떨어지면 화를 내며 돌아가고 신뢰 -1<br><br>주문과 조금 다르면 값을 깎아 받고, 아예 틀리면 한 푼도 못 받아요. 재료비를 빼고 남는 게 순이익이에요. 돈이 ¥200 아래로 떨어지면 소지로가 한 번씩 ¥500을 보태 줘요.`},
 {t:"가게 관리·단골",u:1,h:()=>`주문대의 <b>가게 관리</b>(영업 전·정산 후)에서 번 돈으로 장비를 들일 수 있어요.<br>`+UPG.map(u=>`· <b>${u.n}</b> ${yen(u.c)}: ${u.d}`).join("<br>")+`<br><br>같은 손님을 대만족시키면 친밀도가 올라 <b>단골 랭크</b>(Lv1~3)가 생겨요. 랭크마다 팁 +10%, 인내심 +5초예요.`},
 {t:"연속 만족 콤보",u:1,h:()=>`대만족을 이어 가면 상단에 <b>연속 횟수</b>가 표시돼요. 대만족이 아닌 결과가 나오면 0으로 돌아가요.<br>3·5·7·10번째 연속 대만족에는 소지로가 한마디 칭찬해요. 최고 기록은 영업이 끝날 때 보여줘요.`},
 {t:"계절과 날씨",u:2,h:()=>`계절은 <b>7일</b>마다 봄→여름→가을→겨울로 바뀌어요. 날씨는 가게를 열기 전에 주문대 탭에서 알려줘요.<br><br>`+Object.values(WX).map(w=>`${ic(w.ic)} <b>${w.n}</b> ${w.eff}`).join("<br>")},
 {t:"상담 손님",u:3,h:()=>`메뉴 대신 고민을 들고 오는 손님이에요. 보라색 <b>상담</b> 딱지가 붙어 있어요.<br>카운터의 <b>고민 상담</b>에서 알맞은 답을 고른 뒤 <b>돌려보내기</b>를 눌러요. 맞으면 ¥200을 두고 가요.<br>친구·후배·아이에게는 반말로, 선생님이나 어른에게는 존댓말로 답해 줘요.<br>메뉴를 내거나 답이 틀리면 신뢰가 줄어요.`},
 {t:"급한 손님",u:7,h:()=>`붉은 <b>급함</b> 딱지가 붙은 손님은 인내심이 <b>60초</b>뿐이에요. 대신 대만족시키면 팁이 2배예요.<br>메뉴 완성을 누르면 인내심이 멈춰요. 손질 시간도 포함이니 서두르세요.<br>급한 손님은 연달아 오지 않고, 상담·포장 손님은 급하지 않아요.`},
 {t:"재료 포장 손님",u:10,h:()=>`파란 <b>포장</b> 딱지가 붙은 주문서는 메뉴가 아니라 재료만 원해요. 재료값의 3배를 내요.<br>주문한 재료 하나를 골라 <b>손질하지 말고</b> 카운터의 <b>포장하기</b> 버튼을 눌러요.<br>메뉴를 만들거나, 그냥 돌려보내거나, 다른 재료를 넣거나, 손질한 재료를 포장하면 신뢰가 1 줄어요. 포장 손님이 아닌데 포장하기를 눌러도 신뢰가 줄어요.`}];
function openHelp(){S.help=true;S.hp=0;sfx("page");render()}
function closeHelp(){S.help=false;render()}
function helpGo(d){S.hp=Math.max(0,Math.min(HP.length-1,(S.hp||0)+d));sfx("page");render()}
function helpHTML(){const i=Math.max(0,Math.min(HP.length-1,S.hp||0)),g=HP[i],lock=S.day<g.u;
 return `<div class="modal" onclick="closeHelp()"><div class="mbox" onclick="event.stopPropagation()"><div class="mh"><b>${ic("help")} 도움말 · ${lock?"???":g.t}</b><button onclick="closeHelp()">${ic("x")}</button></div><div class="hpg" style="font-size:14px;line-height:1.65;min-height:150px">${lock?`아직 알 수 없어요.<br><small>${g.u}일차가 되면 열려요.</small>`:g.h()}</div><div class="hnav"><button onclick="helpGo(-1)" ${i?"":"disabled"}>◀ 이전</button><span>${i+1} / ${HP.length}</span><button onclick="helpGo(1)" ${i<HP.length-1?"":"disabled"}>다음 ▶</button></div></div></div>`}

const HAD=(()=>{try{return !!localStorage.getItem("lbt1")}catch(e){return false}})();

// ===== 날씨/계절 파티클 (작은 도트 캔버스, 터치 방해 없음) =====
const FXS=3;let FXC=null,FXX=null,FXP=[],FXK="",FXW=0,FXH=0,FXT=0,FXR=false;
const FXD={
 rain:{n:46,mk:(w,h,i)=>({x:Math.random()*(w+20),y:Math.random()*h,vx:-9,vy:70+Math.random()*30,l:3+(i%3)}),dr:(c,p)=>{c.fillStyle="#6f9fd6";c.globalAlpha=.55;for(let j=0;j<p.l;j++)c.fillRect(Math.round(p.x+j*.35),Math.round(p.y+j),1,1)}},
 snow:{n:40,mk:(w,h,i)=>({x:Math.random()*w,y:Math.random()*h,vx:0,vy:9+Math.random()*9,ph:Math.random()*6,a:3+Math.random()*4}),dr:(c,p)=>{c.globalAlpha=.9;c.fillStyle="#9dbfe0";c.fillRect(Math.round(p.x),Math.round(p.y)+1,2,1);c.fillStyle="#ffffff";c.fillRect(Math.round(p.x),Math.round(p.y),2,1)}},
 cold:{n:26,mk:(w,h)=>({x:Math.random()*w,y:Math.random()*h,vx:2,vy:4+Math.random()*4,ph:Math.random()*6,a:2}),dr:(c,p,t)=>{const b=(Math.sin(t*3+p.ph)+1)/2;c.globalAlpha=.25+b*.7;c.fillStyle="#5fc4e8";const x=Math.round(p.x),y=Math.round(p.y);c.fillRect(x,y,1,1);if(b>.6){c.fillRect(x-1,y,3,1);c.fillRect(x,y-1,1,3);c.fillStyle="#e8fbff";c.fillRect(x,y,1,1)}}},
 hot:{n:30,mk:(w,h)=>({x:Math.random()*w,y:Math.random()*h,vx:0,vy:-(6+Math.random()*8),ph:Math.random()*6,a:3}),dr:(c,p,t)=>{c.globalAlpha=.35+.45*Math.abs(Math.sin(t*2+p.ph));c.fillStyle=p.ph>3?"#ff9a2e":"#ffd45a";c.fillRect(Math.round(p.x),Math.round(p.y),1,1);if(p.ph>4.5)c.fillRect(Math.round(p.x),Math.round(p.y)+1,1,1)}},
 "봄":{n:26,mk:(w,h)=>({x:Math.random()*w,y:Math.random()*h,vx:6+Math.random()*5,vy:7+Math.random()*6,ph:Math.random()*6,a:4}),dr:(c,p,t)=>{c.globalAlpha=.85;const f=Math.sin(t*4+p.ph)>0;c.fillStyle="#ec86ac";c.fillRect(Math.round(p.x),Math.round(p.y),f?2:1,f?1:2);c.fillStyle="#ffd6e4";c.fillRect(Math.round(p.x),Math.round(p.y),1,1)}},
 "여름":{n:18,mk:(w,h)=>({x:Math.random()*w,y:Math.random()*h,vx:0,vy:0,ph:Math.random()*6,a:5}),dr:(c,p,t)=>{const b=(Math.sin(t*1.6+p.ph)+1)/2;c.globalAlpha=.2+b*.75;c.fillStyle="#d8f06a";const x=Math.round(p.x),y=Math.round(p.y);c.fillRect(x,y,1,1);if(b>.7){c.fillStyle="#fff7a8";c.fillRect(x,y,1,1);c.globalAlpha=.3;c.fillStyle="#d8f06a";c.fillRect(x-1,y,3,1);c.fillRect(x,y-1,1,3)}}},
 "가을":{n:20,mk:(w,h)=>({x:Math.random()*w,y:Math.random()*h,vx:-3,vy:9+Math.random()*7,ph:Math.random()*6,a:6,c:["#d8742a","#c2452d","#e0a82e","#8a5a2b"][Math.floor(Math.random()*4)]}),dr:(c,p,t)=>{c.globalAlpha=.9;c.fillStyle=p.c;const f=Math.sin(t*3+p.ph)>0;c.fillRect(Math.round(p.x),Math.round(p.y),2,f?1:2);c.fillRect(Math.round(p.x)+(f?1:0),Math.round(p.y)+1,1,1)}},
 "겨울":{n:16,mk:(w,h)=>({x:Math.random()*w,y:Math.random()*h,vx:0,vy:3,ph:Math.random()*6,a:2}),dr:(c,p,t)=>{const b=(Math.sin(t*2.2+p.ph)+1)/2;c.globalAlpha=.2+b*.6;c.fillStyle="#9dd6f0";c.fillRect(Math.round(p.x),Math.round(p.y),1,1);if(b>.75){c.fillStyle="#ffffff";c.fillRect(Math.round(p.x),Math.round(p.y),1,1)}}}};
function fxKey(){if(S.phase==="over")return "";return S.wx&&S.wx!=="clear"&&FXD[S.wx]?S.wx:season()}
function fxSize(){if(!FXC)return;FXW=Math.max(20,Math.ceil(innerWidth/FXS));FXH=Math.max(20,Math.ceil(innerHeight/FXS));if(FXC.width!==FXW)FXC.width=FXW;if(FXC.height!==FXH)FXC.height=FXH}
function fxFrame(ts){requestAnimationFrame(fxFrame);if(!FXX||document.hidden)return;if(ts-FXT<33)return;const dt=Math.min(0.1,(ts-FXT)/1000);FXT=ts;
 const k=fxKey();if(k!==FXK){FXK=k;fxSize();FXP=k?Array.from({length:FXD[k].n},(_,i)=>FXD[k].mk(FXW,FXH,i)):[]}
 FXX.clearRect(0,0,FXW,FXH);if(!k)return;const d=FXD[k],t=ts/1000;
 for(const p of FXP){p.x+=(p.vx||0)*dt+(p.a&&k!=="rain"?Math.sin(t*1.3+p.ph)*p.a*dt:0);p.y+=(p.vy||0)*dt;
  if(p.y>FXH+3){p.y=-3;p.x=Math.random()*FXW}else if(p.y<-3&&p.vy<0){p.y=FXH+3;p.x=Math.random()*FXW}
  if(p.x>FXW+4)p.x=-3;else if(p.x<-4)p.x=FXW+3;
  d.dr(FXX,p,t)}
 FXX.globalAlpha=1}
function fxInit(){try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;FXC=document.createElement("canvas");FXC.id="fx";FXC.setAttribute("aria-hidden","true");document.body.appendChild(FXC);FXX=FXC.getContext("2d");fxSize();addEventListener("resize",()=>{fxSize();FXK=""});requestAnimationFrame(fxFrame)}catch(e){}}
load();render();fxInit();if(HAD)welcomeBack();
</script></body></html>
