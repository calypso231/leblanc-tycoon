const COOP={"사카모토 류지": {"m": "류지의 곱빼기 카레", "l": [["류지", "야, 렌! 오늘 연습 끝나고 바로 뛰어왔다. 배고파 죽겠어!"], ["류지", "한동안 다리 때문에 제대로 못 뛰었잖아. 근데 요즘은 여기서 먹고 나면 이상하게 기운이 나."], ["렌(생각)", "류지는 늘 전력으로 달린다. 그 속도를 따라잡을 한 그릇이 필요하다."], ["렌", "다음엔 달리고 와서 먹을 걸 만들어 둘게."], ["류지", "진짜냐? 든든하게, 곱빼기로! 약속이다!"], ["렌(생각)", "카레에 삶은 달걀을 올린 류지의 곱빼기 카레를 메뉴에 올리자."]]}, "타카마키 안": {"m": "안의 딸기 크레이프", "l": [["안", "렌, 나 오늘 크레이프 가게 세 군데나 돌고 왔어. 결국 제일 맛있는 건 못 찾았지만."], ["안", "시호랑 자주 가던 가게가 문을 닫았거든… 그래서 르블랑에서 크레이프를 팔면 좋겠다 싶었어."], ["렌(생각)", "딸기, 버터의 고소함, 부드러운 우유. 안이 좋아하는 맛이 떠오른다."], ["렌", "한번 만들어 볼게. 첫 접시는 안이 맛봐 줘."], ["안", "정말? 기대된다! 시호한테도 사진 보내서 자랑할 거야."], ["렌(생각)", "달콤한 걸 좋아하는 안을 위한 딸기 크레이프를 메뉴에 올리자."]]}, "키타가와 유스케": {"m": "화가의 카레빵", "l": [["유스케", "렌, 이 가게의 빛은 참 좋군. 저녁 무렵 카운터에 떨어지는 그림자가 특히."], ["유스케", "그림이 막힐 때면 여기 와서 카레 향을 맡는다. …사실 화구를 사느라 오늘 아무것도 못 먹었다."], ["렌(생각)", "스승의 그늘을 벗어난 뒤로, 유스케는 배를 곯아도 자기 그림을 그린다."], ["렌", "그리면서 한 손으로 먹을 수 있는 걸 만들어 줄게."], ["유스케", "…빵 속에 카레라니. 그 자체로 하나의 작품이군."], ["렌(생각)", "식빵에 카레를 채운 화가의 카레빵을 메뉴에 올리자."]]}, "니지마 마코토": {"m": "마코토의 집중 블렌드", "l": [["마코토", "렌, 오늘도 학생회 일이 늦게 끝났어. 언니도 야근이라 집에 가도 혼자고."], ["마코토", "공부할 때 마실 걸 찾고 있는데, 너무 쓰면 집중이 깨지고 너무 달면 졸리고…"], ["렌(생각)", "마코토는 늘 계획적이다. 균형 잡힌 한 잔이 필요하다."], ["렌", "공부할 때 딱 좋은 걸로 맞춰 볼게."], ["마코토", "고마워. 다음엔 언니랑 같이 올게. 언니 몫도 부탁해."], ["렌(생각)", "생강으로 몸을 데우고, 블렌드로 깨우고, 우유로 부드럽게. 마코토의 블렌드로 하자."]]}, "사쿠라 후타바": {"m": "후타바의 해커 토스트", "l": [["후타바", "렌! 밤새 코딩하다가 당이 바닥났다. 긴급 보급을 요청한다!"], ["후타바", "엄마도 연구할 땐 맨날 토스트만 먹었대. 소지로가 그러더라. …그러니까 달고 네모난 거."], ["렌(생각)", "후타바다운 주문이다. 키보드 옆에 두고 먹을 수 있는 걸로 하자."], ["렌", "버터랑 초콜릿 올린 토스트 어때?"], ["후타바", "오오, 최적의 조합! 당 수치 상승 확인! 이건 내 전용 아이템으로 등록한다!"], ["렌(생각)", "후타바만을 위한 해커 토스트를 메뉴에 올리자."]]}, "오쿠무라 하루": {"m": "하루의 원두 블렌드", "l": [["하루", "렌 군, 오늘 원두 냄새가 평소랑 조금 다르네. 새로 들어온 거야?"], ["하루", "나, 사실 커피를 직접 블렌드해 보는 게 꿈이었어. 아버지 회사 일이 정리되면, 언젠가 내 카페를 열고 싶어."], ["렌(생각)", "하루는 커피를 정말 좋아한다. 함께 블렌드를 만들어 봐도 좋겠다."], ["렌", "르블랑 블렌드에 모카빈을 섞어 보자."], ["하루", "와… 향이 훨씬 깊어졌다. 이건 우리 둘이 만든 블렌드네."], ["렌(생각)", "하루와 함께 만든 블렌드를 정식 메뉴로 올리자."]]}, "아케치 고로": {"m": "탐 function sTone(f,t,dur,type,vol,f2){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.014,dur*0.3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.master);o.start(t);o.stop(t+dur+0.03)}
function sSwish(t,dur,f1,f2,vol,att){const a=AC,x=a.createBufferSource();x.buffer=NB;x.loop=true;const f=a.createBiquadFilter();f.type="lowpass";f.Q.value=0.3;f.frequency.setValueAtTime(f1,t);f.frequency.linearRampToValueAtTime(f2,t+dur*0.5);f.frequency.linearRampToValueAtTime(f1,t+dur);const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.linearRampToValueAtTime(0,t+dur);x.connect(f);f.connect(g);g.connect(a.master);x.start(t,Math.random()*0.5);x.stop(t+dur+0.03)}
function sNoise(t,dur,type,freq,q,vol,f2){const a=AC,s=a.createBufferSource();s.buffer=NB;s.loop=true;const f=a.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);f.Q.value=q||1;const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.01,dur*0.3));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(a.master);s.start(t,Math.random()*0.5);s.stop(t+dur+0.03)}
function sBell(t,f,v){sTone(f,t,1.4,"sine",v);sTone(f*2.76,t,0.7,"sine",v*0.35);sTone(f*5.4,t,0.32,"sine",v*0.14)}
const N=m=>440*Math.pow(2,(m-69)/12);
function sEP(f,t,dur,vol){const a=AC,c=a.createOscillator(),m=a.createOscillator(),mg=a.createGain(),g=a.createGain();c.type="sine";m.type="sine";c.frequency.value=f;m.frequency.value=f;mg.gain.setValueAtTime(Math.min(f*1.6,700),t);mg.gain.exponentialRampToValueAtTime(f*0.08,t+0.3);m.connect(mg);mg.connect(c.frequency);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(vol*0.35,t+0.12);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);c.connect(g);g.connect(a.master);c.start(t);m.start(t);c.stop(t+dur+0.05);m.stop(t+dur+0.05);if(f<900)sTone(f*3,t,0.06,"sine",vol*0.12)}
function sChord(ms,t,dur,vol,st){ms.forEach((m,i)=>sEP(N(m),t+i*(st||0),dur,vol))}
function sBass(f,t,dur,vol,f2){const a=AC,o=a.createOscillator(),fl=a.createBiquadFilter(),g=a.createGain();o.type="triangle";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.type="lowpass";fl.Q.value=2;fl.frequency.setValueAtTime(f*8,t);fl.frequency.exponentialRampToValueAtTime(f*1.8,t+dur*0.7);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.009);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(fl);fl.connect(g);g.connect(a.master);o.start(t);o.stop(t+dur+0.05);sTone(f,t,dur,"sine",vol*0.6,f2)}
const sHat=(t,v,d)=>sTone(2600,t,d||0.04,"sine",(v||0.06)*0.45),sSnare=(t,v)=>{sTone(240,t,0.14,"sine",(v||0.16)*0.9,150);sNoise(t,0.08,"lowpass",1400,0.5,(v||0.16)*0.18)},sKick=(t,v)=>sTone(140,t,0.2,"sine",v||0.3,42),sSlash=(t,v)=>{sTone(420,t,0.2,"sine",(v||0.1)*0.9,1300);sNoise(t,0.16,"lowpass",1800,0.5,(v||0.1)*0.2)};

function sfx(n,a){if(!SND)return;const c=ac();if(!c||!SFX[n])return;try{SFX[n](c.currentTime+0.01,a)}catch(e){}}
function sLoop(type,freq,q,vol){if(!SND)return null;const a=ac();if(!a)return null;try{const s=a.createBufferSource();s.buffer=NB;s.loop=true;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(0.0001,a.currentTime);g.gain.linearRampToValueAtTime(vol,a.currentTime+0.15);s.connect(f);f.connect(g);g.connect(a.master);s.start();return{stop(){try{const n=a.currentTime;g.gain.cancelScheduledValues(n);g.gain.setValueAtTime(Math.max(g.gain.value,0.0001),n);g.gain.linearRampToValueAtTime(0.0001,n+0.12);s.stop(n+0.14)}catch(e){}}}}catch(e){return null}}

 picks.forEach((k,i)=>at(300+i*600+750,()=>{sfx("drop");BAT.push(setTimeout(()=>sfx("plop"),90))}));
 for(let ms=100;ms<5400;ms+=230)at(ms,()=>sfx("crackle"));
 at(2400,()=>{BL=sLoop("lowpass",220,0.5,0.03)});
 for(let ms=2450;ms<5400;ms+=85+Math.floor(Math.random()*85))at(ms,()=>sfx("boil"));
 at(5400,()=>{if(BL){BL.stop();BL=null}});
 at(6200,()=>{POURL=sLoop("lowpass",700,0.4,0.016)});
 for(let ms=6250,i=0;ms<7950;ms+=85+Math.floor(Math.random()*40),i++)at(ms,()=>{const a=ac();if(a&&SND)sTone(420+(ms-6250)*0.22+Math.random()*60,a.currentTime+0.01,0.07,"sine",0.012)});

 else at(8450,()=>sfx("ting"))}

function fxKey(){if(S.phase==="over")return "";return S.wx&&S.wx!=="clear"&&FXD[S.wx]?S.wx:season()}
function fxSize(){if(!FXC)return;FXW=Math.max(20,Math.ceil(innerWidth/FXS));FXH=Math.max(20,Math.ceil(innerHeight/FXS));if(FXC.width!==FXW)FXC.width=FXW;if(FXC.height!==FXH)FXC.height=FXH}
function fxFrame(ts){requestAnimationFrame(fxFrame);if(!FXX||document.hidden)return;if(ts-FXT<33)return;const dt=Math.min(0.1,(ts-FXT)/1000);FXT=ts;
 const k=fxKey();if(k!==FXK){FXK=k;fxSize();FXP=k?Array.from({length:FXD[k].n},(_,i)=>FXD[k].mk(FXW,FXH,i)):[]}
 FXX.clearRect(0,0,FXW,FXH);if(!k)return;const d=FXD[k],t=ts/1000;

 FXX.globalAlpha=1}
